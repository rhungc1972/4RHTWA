<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Orange Glow -->
    <radialGradient id="orangeGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF6105" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FF6105" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FF6105" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Rim Light -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222225" />
      <stop offset="50%" stop-color="#151518" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6105" />
      <stop offset="100%" stop-color="#993800" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C39F" />
      <stop offset="50%" stop-color="#E2A980" />
      <stop offset="100%" stop-color="#C28760" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55555c" />
      <stop offset="60%" stop-color="#2a2a2e" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <circle cx="300" cy="280" r="260" fill="url(#orangeGlow)" />

  <!-- Subtle Studio Grid / Cyber Network Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="600" x2="600" y2="600" />
  </g>

  <!-- Silhouette / Portrait -->
  <g id="portraitBody">
    <!-- Suit Shoulders & Torso -->
    <path d="M 120 780 C 130 630 180 540 230 500 L 260 500 L 300 580 L 340 500 L 370 500 C 420 540 470 630 480 780 Z" fill="url(#suitGrad)" stroke="#333338" stroke-width="2" />

    <!-- Suit Lapels -->
    <path d="M 230 500 L 275 660 L 300 660 L 270 500 Z" fill="#1b1b1e" stroke="#FF6105" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M 370 500 L 325 660 L 300 660 L 330 500 Z" fill="#18181a" stroke="#FF6105" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- White Collar Shirt -->
    <polygon points="270,490 300,560 330,490 300,470" fill="url(#shirtGrad)" />

    <!-- Orange Silk Tie -->
    <polygon points="293,520 307,520 312,680 300,710 288,680" fill="url(#tieGrad)" />
    <polygon points="290,520 310,520 305,550 295,550" fill="#ff7d2b" />

    <!-- Neck -->
    <path d="M 270 420 L 270 490 C 285 505 315 505 330 490 L 330 420 Z" fill="url(#skinGrad)" />
    <!-- Neck Shadow -->
    <path d="M 270 420 C 290 450 310 450 330 420 C 330 450 270 450 270 420 Z" fill="#aa724c" opacity="0.4" />

    <!-- Head / Jawline -->
    <path d="M 230 310 C 230 425 255 460 300 460 C 345 460 370 425 370 310 C 370 215 345 200 300 200 C 255 200 230 215 230 310 Z" fill="url(#skinGrad)" stroke="#c28760" stroke-width="1" />

    <!-- Hair (Distinguished Salt & Pepper Academic Styling) -->
    <path d="M 225 280 C 220 220 250 170 300 170 C 350 170 380 220 375 280 C 370 240 350 200 300 200 C 250 200 230 240 225 280 Z" fill="url(#hairGrad)" />
    <path d="M 228 290 C 220 240 245 190 295 180 C 345 180 372 230 372 290 C 365 240 340 210 295 210 C 250 210 235 240 228 290 Z" fill="#64646e" opacity="0.4" />

    <!-- Ears -->
    <ellipse cx="230" cy="325" rx="10" ry="20" fill="#E2A980" />
    <ellipse cx="370" cy="325" rx="10" ry="20" fill="#D3976D" />

    <!-- Eyebrows -->
    <path d="M 252 290 Q 272 284 288 290" stroke="#333338" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 312 290 Q 328 284 348 290" stroke="#333338" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Eyes (Intelligent, warm gaze) -->
    <ellipse cx="270" cy="305" rx="8" ry="4.5" fill="#ffffff" />
    <circle cx="271" cy="305" r="3.5" fill="#3e2723" />
    <circle cx="272" cy="304" r="1.2" fill="#ffffff" />

    <ellipse cx="330" cy="305" rx="8" ry="4.5" fill="#ffffff" />
    <circle cx="329" cy="305" r="3.5" fill="#3e2723" />
    <circle cx="330" cy="304" r="1.2" fill="#ffffff" />

    <!-- ICONIC ORANGE DESIGNER SPECTACLES (Gafas Naranjas Características) -->
    <!-- Left Rim -->
    <rect x="250" y="292" width="40" height="26" rx="6" fill="none" stroke="#FF6105" stroke-width="4" />
    <!-- Right Rim -->
    <rect x="310" y="292" width="40" height="26" rx="6" fill="none" stroke="#FF6105" stroke-width="4" />
    <!-- Spectacles Bridge -->
    <path d="M 290 300 Q 300 295 310 300" fill="none" stroke="#FF6105" stroke-width="3.5" stroke-linecap="round" />
    <!-- Spectacles Temples -->
    <line x1="250" y1="298" x2="230" y2="304" stroke="#FF6105" stroke-width="3.5" stroke-linecap="round" />
    <line x1="350" y1="298" x2="370" y2="304" stroke="#FF6105" stroke-width="3.5" stroke-linecap="round" />
    <!-- Glass Reflex Glow -->
    <line x1="255" y1="296" x2="270" y2="313" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="315" y1="296" x2="330" y2="313" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Nose -->
    <path d="M 300 305 L 297 340 L 305 342" stroke="#aa724c" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Thoughtful Confident Smile -->
    <path d="M 280 375 Q 300 388 320 375" stroke="#8d4b2e" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Under-lip shadow -->
    <path d="M 292 392 Q 300 395 308 392" stroke="#aa724c" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Decorative Keynote Overlays -->
  <!-- Top Right Emblem Badge -->
  <g transform="translate(470, 50)">
    <circle cx="45" cy="45" r="42" fill="#18181b" stroke="#FF6105" stroke-width="2" />
    <circle cx="45" cy="45" r="38" fill="none" stroke="#ffffff" stroke-dasharray="3,3" stroke-width="1" opacity="0.5" />
    <text x="45" y="38" fill="#FF6105" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">RWA</text>
    <text x="45" y="52" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle" letter-spacing="1">DOCTRINA</text>
    <text x="45" y="64" fill="#a1a1aa" font-family="monospace" font-size="7" text-anchor="middle">2026</text>
  </g>

  <!-- Bottom Gradient Banner with Name & Credential -->
  <rect x="0" y="660" width="600" height="140" fill="url(#bgGrad)" opacity="0.95" />
  <line x1="0" y1="660" x2="600" y2="660" stroke="#FF6105" stroke-width="2" />

  <text x="300" y="705" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">
    ROBERTO HUNG CAVALIERI
  </text>
  <text x="300" y="730" fill="#FF6105" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">
    CULTURA DE LA ECONOMÍA TOKENIZADA · RWA
  </text>
  <text x="300" y="755" fill="#a1a1aa" font-family="sans-serif" font-size="11" text-anchor="middle">
    «Te invito a que pensemos diferente.» · www.robertohung.com
  </text>
</svg>
